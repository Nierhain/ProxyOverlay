name: Build

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to rebuild and release (for example, v1.0.0)
        required: true
        type: string

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Determine version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test ProxyOverlay.slnx -c Release

      - name: Publish
        run: dotnet publish ProxyOverlay/ProxyOverlay.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:Version=${{ needs.version.outputs.version }} -o publish/${{ matrix.rid }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProxyOverlay-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
          retention-days: 30

  package-windows:
    needs: [build, version]
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Download Windows publish output
        uses: actions/download-artifact@v4
        with:
          name: ProxyOverlay-win-x64
          path: publish/win-x64

      - name: Install Velopack CLI
        shell: pwsh
        run: dotnet tool install --tool-path .velopack vpk --version 0.0.140

      - name: Build Windows Velopack package
        shell: pwsh
        run: >-
          .\.velopack\vpk.exe pack
          --packId ProxyOverlay
          --packVersion ${{ needs.version.outputs.version }}
          --packDir publish/win-x64
          --mainExe ProxyOverlay.exe
          --packTitle ProxyOverlay
          --packAuthors Nierhain
          --icon ProxyOverlay/Assets/icon.ico
          --runtime win-x64
          --channel win
          --outputDir publish/installer

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ProxyOverlay-Windows-Installer
          path: publish/installer/*
          retention-days: 30

  package-linux:
    needs: [build, version]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Download Linux publish output
        uses: actions/download-artifact@v4
        with:
          name: ProxyOverlay-linux-x64
          path: publish/linux-x64

      - name: Create AppImage layout
        shell: bash
        run: |
          mkdir -p AppDir/usr/bin
          cp -a publish/linux-x64/. AppDir/usr/bin/
          chmod +x AppDir/usr/bin/ProxyOverlay
          cp ProxyOverlay/Assets/icon.png AppDir/proxyoverlay.png
          cat > AppDir/proxyoverlay.desktop <<'EOF'
          [Desktop Entry]
          Name=ProxyOverlay
          Comment=Apply overlays to image batches
          Exec=ProxyOverlay
          Icon=proxyoverlay
          Type=Application
          Categories=Graphics;
          Terminal=false
          Keywords=proxy;overlay;images;Magic;cards;
          StartupWMClass=ProxyOverlay
          X-AppImage-Name=ProxyOverlay
          X-AppImage-Arch=x86_64
          EOF
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          exec "$(dirname "$0")/usr/bin/ProxyOverlay" "$@"
          EOF
          chmod +x AppDir/AppRun

      - name: Install appimagetool
        shell: bash
        run: |
          curl -L --fail --retry 3 \
            -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage

      - name: Build AppImage
        shell: bash
        run: |
          mkdir -p publish/installer
          ./appimagetool.AppImage --appimage-extract-and-run \
            AppDir publish/installer/ProxyOverlay-linux-x86_64.AppImage

      - name: Upload Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: ProxyOverlay-Linux-AppImage
          path: publish/installer/ProxyOverlay-linux-x86_64.AppImage
          retention-days: 30

  package-macos:
    needs: [build, version]
    runs-on: macos-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Download macOS publish output
        uses: actions/download-artifact@v4
        with:
          name: ProxyOverlay-osx-arm64
          path: publish/osx-arm64

      - name: Create macOS application bundle
        shell: bash
        run: |
          mkdir -p ProxyOverlay.app/Contents/MacOS
          cp -a publish/osx-arm64/. ProxyOverlay.app/Contents/MacOS/
          chmod +x ProxyOverlay.app/Contents/MacOS/ProxyOverlay
          mkdir -p ProxyOverlay.iconset ProxyOverlay.app/Contents/Resources
          sips -z 16 16 ProxyOverlay/Assets/icon.png --out ProxyOverlay.iconset/icon_16x16.png
          sips -z 32 32 ProxyOverlay/Assets/icon.png --out ProxyOverlay.iconset/icon_16x16@2x.png
          sips -z 32 32 ProxyOverlay/Assets/icon.png --out ProxyOverlay.iconset/icon_32x32.png
          sips -z 64 64 ProxyOverlay/Assets/icon.png --out ProxyOverlay.iconset/icon_32x32@2x.png
          sips -z 128 128 ProxyOverlay/Assets/icon.png --out ProxyOverlay.iconset/icon_128x128.png
          sips -z 256 256 ProxyOverlay/Assets/icon.png --out ProxyOverlay.iconset/icon_128x128@2x.png
          sips -z 256 256 ProxyOverlay/Assets/icon.png --out ProxyOverlay.iconset/icon_256x256.png
          sips -z 512 512 ProxyOverlay/Assets/icon.png --out ProxyOverlay.iconset/icon_256x256@2x.png
          sips -z 512 512 ProxyOverlay/Assets/icon.png --out ProxyOverlay.iconset/icon_512x512.png
          sips -z 1024 1024 ProxyOverlay/Assets/icon.png --out ProxyOverlay.iconset/icon_512x512@2x.png
          iconutil -c icns ProxyOverlay.iconset -o ProxyOverlay.app/Contents/Resources/ProxyOverlay.icns
          cat > ProxyOverlay.app/Contents/Info.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>ProxyOverlay</string>
              <key>CFBundleExecutable</key>
              <string>ProxyOverlay</string>
              <key>CFBundleIdentifier</key>
              <string>com.proxyoverlay.app</string>
              <key>CFBundleIconFile</key>
              <string>ProxyOverlay</string>
              <key>CFBundleName</key>
              <string>ProxyOverlay</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>${APP_VERSION}</string>
              <key>CFBundleVersion</key>
              <string>${APP_VERSION}</string>
          </dict>
          </plist>
          EOF

      - name: Build DMG
        shell: bash
        run: |
          mkdir -p publish/installer
          hdiutil create \
            -volname ProxyOverlay \
            -srcfolder ProxyOverlay.app \
            -ov \
            -format UDZO \
            publish/installer/ProxyOverlay-macos-arm64.dmg

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: ProxyOverlay-macOS-DMG
          path: publish/installer/ProxyOverlay-macos-arm64.dmg
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [package-windows, package-linux, package-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged installers
        uses: actions/download-artifact@v4
        with:
          name: ProxyOverlay-Windows-Installer
          path: release-assets/windows

      - name: Download Linux installer
        uses: actions/download-artifact@v4
        with:
          name: ProxyOverlay-Linux-AppImage
          path: release-assets/linux

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: ProxyOverlay-macOS-DMG
          path: release-assets/macos

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.exe
            release-assets/**/*.nupkg
            release-assets/**/RELEASES*
            release-assets/**/*.zip
            release-assets/**/*.AppImage
            release-assets/**/*.dmg
